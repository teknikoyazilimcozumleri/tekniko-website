services:
  web:
    container_name: tekniko-website-web
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      PAYMENT_CALLBACK_HOST: ${PAYMENT_CALLBACK_HOST:-}
      NGROK_PUBLIC_URL: ${NGROK_PUBLIC_URL:-}
    volumes:
      - .:/app
    depends_on:
      - db
    networks:
      - iyzico_network

  nginx:
    container_name: tekniko-website-nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - nginx_certs:/etc/nginx/certs
    networks:
      - iyzico_network

  db:
    container_name: tekniko-website-db
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - iyzico_network

volumes:
  pgdata:
  nginx_certs:

networks:
  iyzico_network:
    driver: bridge